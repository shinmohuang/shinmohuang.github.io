name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Fetch citation data (SerpAPI)
      working-directory: ./google_scholar_crawler
      run: python3 main.py
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

    - name: Publish to google-scholar-stats branch
      working-directory: ./google_scholar_crawler/results
      run: |
        git init -q
        git config --local user.name "shinmohuang"
        git config --local user.email "shinmohuang@163.com"
        git add *.json
        git commit -qm "Updated Citation Data"
        git push --force "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats

    - name: Purge jsDelivr cache
      run: |
        for f in gs_data.json gs_data_shieldsio.json; do
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@google-scholar-stats/$f" >/dev/null || true
        done
